<style>
/* Layout: three screens in one column — level map (5×2 tiles), question card with big answer buttons, results. Teal ground, sunny-yellow reward colour. */
:root{
  --bg:#e3f4f1; --card:#ffffff; --ink:#173a3a; --muted:#56706f; --line:#c3dfda;
  --accent:#0f8b8d; --accentInk:#ffffff; --sun:#ffc23d; --sunInk:#5a3d00;
  --good:#23945a; --goodBg:#dcf5e6; --bad:#d4413c; --badBg:#fde2e0; --lock:#c9d8d5;
  --display:"Lilita One","Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1f20; --card:#172d2e; --ink:#e6f4f2; --muted:#9dbbb8; --line:#28494a;
  --accent:#3cc3c4; --accentInk:#06201f; --sun:#ffcb57; --sunInk:#3a2700;
  --good:#5fd69a; --goodBg:#163a29; --bad:#ff7d77; --badBg:#41201e; --lock:#2b4344;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1f20; --card:#172d2e; --ink:#e6f4f2; --muted:#9dbbb8; --line:#28494a;
  --accent:#3cc3c4; --accentInk:#06201f; --sun:#ffcb57; --sunInk:#3a2700;
  --good:#5fd69a; --goodBg:#163a29; --bad:#ff7d77; --badBg:#41201e; --lock:#2b4344;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);padding:22px 16px 40px}
main{max-width:640px;margin:0 auto}
button{font-family:var(--body);cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:var(--display);font-weight:400;font-size:2.6rem;line-height:1;margin:0;color:var(--accent);letter-spacing:.5px}
.total{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-weight:900;font-variant-numeric:tabular-nums}
.total svg{width:26px;height:26px}

/* map */
.intro{margin:0 0 16px;color:var(--muted);font-weight:700;line-height:1.5}
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:560px){.levels{gap:8px}.lvl{padding:8px 2px;border-radius:14px}.lvl .t{display:none}.lvl .n{font-size:1.6rem}.lvl .st svg{width:12px;height:12px}.lvl .n svg{width:24px;height:24px}}
.lvl{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.lvl .n{font-family:var(--display);font-size:2.2rem;line-height:1;color:var(--accent)}
.lvl .t{font-size:.78rem;font-weight:800;color:var(--muted);text-align:center;line-height:1.2;min-height:2.4em}
.lvl .st{display:flex;gap:2px}
.lvl .st svg{width:18px;height:18px}
.lvl.next{border-color:var(--accent);box-shadow:0 5px 0 var(--accent)}
.lvl.locked{background:transparent;border-style:dashed;cursor:not-allowed}
.lvl.locked .n{color:var(--lock)}
.lvl:not(.locked):hover{transform:translateY(-2px)}
.legend{margin:18px 0 0;font-size:.88rem;color:var(--muted);font-weight:700;line-height:1.5}
.reset{margin-top:14px;background:none;border:0;color:var(--muted);font-weight:800;text-decoration:underline;padding:4px 0}
.confirm{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:800}
.confirm button{border-radius:10px;padding:6px 14px;font-weight:800;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.confirm .yes{background:var(--bad);border-color:var(--bad);color:#fff}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.back{border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;border-radius:12px;padding:8px 12px}
.lvlTag{font-family:var(--display);font-size:1.4rem;color:var(--accent)}
.dots{display:flex;gap:6px;margin-bottom:14px}
.dots i{flex:1;height:10px;border-radius:5px;background:var(--line)}
.dots i.good{background:var(--good)} .dots i.bad{background:var(--bad)} .dots i.now{background:var(--sun)}
.qcard{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:22px 18px;display:flex;flex-direction:column;gap:16px}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qnum{font-weight:900;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.speak{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem;display:flex;gap:6px;align-items:center}
.speak svg{width:18px;height:18px}
.question{font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,5vw,2rem);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:.3px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.opt{display:flex;align-items:center;gap:12px;text-align:left;font-size:1.15rem;font-weight:800;padding:14px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);min-height:64px}
.opt .k{flex:none;width:34px;height:34px;border-radius:10px;background:var(--bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.15rem}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--goodBg)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badBg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.5}
.feedback{border-radius:16px;padding:14px 16px;font-weight:700;line-height:1.5}
.feedback strong{display:block;font-family:var(--display);font-weight:400;font-size:1.35rem;letter-spacing:.3px}
.feedback.good{background:var(--goodBg)} .feedback.good strong{color:var(--good)}
.feedback.bad{background:var(--badBg)} .feedback.bad strong{color:var(--bad)}
.next{align-self:flex-end;font-family:var(--display);font-size:1.3rem;padding:10px 26px;border-radius:999px;border:0;background:var(--accent);color:var(--accentInk);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.next:active{transform:translateY(3px);box-shadow:none}

/* results */
.result{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.bigStars{display:flex;gap:10px}
.bigStars svg{width:64px;height:64px}
.bigStars svg.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.result h2{font-family:var(--display);font-weight:400;font-size:2.4rem;margin:0;line-height:1.05;color:var(--accent)}
.score{font-size:1.25rem;font-weight:900;margin:0}
.result p{margin:0;color:var(--muted);font-weight:700;max-width:40ch;line-height:1.5}
.rbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.rbtns button{font-weight:900;font-size:1rem;padding:12px 20px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.rbtns button.primary{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.rbtns button[hidden]{display:none}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

const $=id=>document.getElementById(id);
const STAR = f=>`<svg viewBox="0 0 24 24"><path fill="${f?'var(--sun)':'var(--lock)'}" stroke="${f?'var(--sunInk)':'var(--lock)'}" stroke-width="1.2" stroke-linejoin="round" d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>`;
const PASS=6;
let best=new Array(LEVELS.length).fill(-1); // best score per level, -1 = never played
try{ const b=JSON.parse(localStorage.getItem('qq-best')||'null'); if(Array.isArray(b)) b.forEach((v,i)=>{ if(i<best.length && typeof v==='number') best[i]=v; }); }catch(e){}
const save=()=>{ try{ localStorage.setItem('qq-best',JSON.stringify(best)); }catch(e){} };
const starsFor=s=> s>=10?3 : s>=8?2 : s>=PASS?1 : 0;
const unlocked=i=> i===0 || best[i-1]>=PASS;

let L=0, qs=[], qi=0, score=0, results=[];

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function show(id){ for(const s of ['mapScreen','quizScreen','resultScreen']) $(s).hidden = s!==id; window.scrollTo(0,0); }
function updateTotal(){ $('totalStars').textContent = best.reduce((t,s)=>t+starsFor(s),0); }

function renderMap(){
  const box=$('levels'); box.innerHTML='';
  const firstOpen = best.findIndex((s,i)=>unlocked(i) && s<PASS);
  LEVELS.forEach((lv,i)=>{
    const b=document.createElement('button'); b.className='lvl'; b.id='lvl'+i;
    const open=unlocked(i), st=starsFor(best[i]);
    if(!open) b.classList.add('locked');
    if(i===firstOpen) b.classList.add('next');
    b.innerHTML=`<span class="n">${open?i+1:'<svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="var(--lock)" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'}</span><span class="t">${lv.name}</span><span class="st">${STAR(st>=1)}${STAR(st>=2)}${STAR(st>=3)}</span>`;
    b.setAttribute('aria-label', open ? `Level ${i+1}, ${lv.name}, ${st} stars` : `Level ${i+1}, locked`);
    b.onclick=()=>{ if(open) startLevel(i); };
    box.appendChild(b);
  });
  updateTotal();
}

function startLevel(i){
  L=i; qi=0; score=0; results=[];
  qs = shuffle(LEVELS[i].q).map(([q,opts,fact])=>({q, correct:opts[0], opts:shuffle(opts), fact}));
  $('lvlTag').textContent=`Level ${i+1} · ${LEVELS[i].name}`;
  show('quizScreen'); renderQ();
}

function renderDots(){
  $('dots').innerHTML = qs.map((_,k)=>`<i class="${k<results.length?(results[k]?'good':'bad'):(k===qi?'now':'')}"></i>`).join('');
}

function renderQ(){
  stopSpeech();
  const Q=qs[qi];
  $('qnum').textContent=`Question ${qi+1} of 10`;
  $('question').textContent=Q.q;
  $('feedback').hidden=true; $('nextBtn').hidden=true;
  const o=$('opts'); o.innerHTML='';
  Q.opts.forEach((t,k)=>{
    const b=document.createElement('button'); b.className='opt'; b.id='opt'+k;
    b.innerHTML=`<span class="k">${'ABCD'[k]}</span><span></span>`; b.lastChild.textContent=t;
    b.onclick=()=>answer(k);
    o.appendChild(b);
  });
  renderDots();
}

const CHEERS=["Correct!","Yes, well done!","Super!","Spot on!","Brilliant!","You got it!"];
function answer(k){
  const Q=qs[qi], picked=Q.opts[k], ok=picked===Q.correct;
  results.push(ok); if(ok) score++;
  Q.opts.forEach((t,j)=>{
    const b=$('opt'+j); b.disabled=true;
    if(t===Q.correct) b.classList.add('right');
    else if(j===k) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const f=$('feedback');
  f.className='feedback '+(ok?'good':'bad');
  f.innerHTML=`<strong></strong><span></span>`;
  f.firstChild.textContent = ok ? CHEERS[Math.floor(Math.random()*CHEERS.length)] : `The answer is ${Q.correct}.`;
  f.lastChild.textContent = Q.fact;
  f.hidden=false;
  const n=$('nextBtn'); n.textContent = qi===9 ? 'See my score' : 'Next'; n.hidden=false; n.focus();
  renderDots();
  tone(ok);
}

function finish(){
  stopSpeech();
  const prev=best[L]; if(score>prev) best[L]=score; save();
  const st=starsFor(score), passed=score>=PASS;
  $('bigStars').innerHTML=[0,1,2].map(k=>STAR(k<st)).join('');
  [...$('bigStars').children].forEach((s,k)=>{ if(k<st){ s.classList.add('pop'); s.style.animationDelay=(k*.25)+'s'; } });
  $('rScore').textContent=`${score} out of 10 right`;
  if(score===10){ $('rTitle').textContent='Perfect score!'; $('rText').textContent='Every single answer was right. You are a superstar!'; }
  else if(passed){ $('rTitle').textContent='Level complete!'; $('rText').textContent= L<LEVELS.length-1 ? `Level ${L+2} is now open. Want to try again for more stars first?` : 'You finished the very last level. Amazing!'; }
  else { $('rTitle').textContent='Nice try!'; $('rText').textContent=`You need ${PASS} right answers to open the next level. You can do it, have another go!`; }
  $('rNext').hidden = !(passed && L<LEVELS.length-1);
  $('rRetry').classList.toggle('primary', !passed);
  show('resultScreen');
  if(passed) fanfare();
}

/* sound + speech */
let ac=null;
function note(f,d,delay){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); const t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d); }catch(e){} }
function tone(ok){ if(ok){note(660,.12);note(880,.2,.1);} else {note(300,.18);note(220,.25,.14);} }
function fanfare(){ [523,659,784,1047].forEach((f,k)=>note(f,.3,k*.14)); }
const canSpeak = 'speechSynthesis' in window;
function stopSpeech(){ try{ if(canSpeak) speechSynthesis.cancel(); }catch(e){} }
function speak(){
  if(!canSpeak) return;
  const Q=qs[qi];
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(Q.q+' '+Q.opts.map((t,k)=>'ABCD'[k]+'. '+t+'.').join(' '));
    u.rate=.9; u.lang='en-IN'; speechSynthesis.speak(u);
  }catch(e){}
}
if(!canSpeak) $('speakBtn').hidden=true;

/* wiring */
$('speakBtn').onclick=speak;
$('nextBtn').onclick=()=>{ if(qi<9){ qi++; renderQ(); } else finish(); };
$('backBtn').onclick=()=>{ stopSpeech(); renderMap(); show('mapScreen'); };
$('rNext').onclick=()=>startLevel(L+1);
$('rRetry').onclick=()=>startLevel(L);
$('rMap').onclick=()=>{ renderMap(); show('mapScreen'); };
$('resetBtn').onclick=()=>{ $('confirmBox').hidden=false; };
$('resetNo').onclick=()=>{ $('confirmBox').hidden=true; };
$('resetYes').onclick=()=>{ best=new Array(LEVELS.length).fill(-1); save(); $('confirmBox').hidden=true; renderMap(); };
document.addEventListener('keydown',e=>{
  if($('quizScreen').hidden) return;
  const k='abcd'.indexOf(e.key.toLowerCase()); const n='1234'.indexOf(e.key);
  const idx = k>=0?k:n;
  if(idx>=0 && $('nextBtn').hidden){ $('opt'+idx)?.click(); }
});

renderMap();
})();
</script>
