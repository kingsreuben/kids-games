<style>
:root{--accent:#e8590c;--ink-line:#2b2b2b}
@media (prefers-color-scheme: dark){:root{--accent:#ff8c4a;--accentInk:#2a1100}}
.picker{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.pick{flex:none;width:92px;border:3px solid var(--line);background:var(--card);border-radius:16px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;scroll-snap-align:start}
.pick[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 4px 0 var(--accent)}
.pick svg{width:72px;height:72px;border-radius:8px;background:#fff}
.pick span{font-size:.78rem;font-weight:800}
.studio{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
@media (max-width:820px){.studio{grid-template-columns:minmax(0,1fr)}}
.paper{background:#fff;border:3px solid var(--line);border-radius:20px;padding:10px;box-shadow:0 6px 0 var(--line)}
.paper svg{display:block;width:100%;height:auto;max-height:66vh;touch-action:none;user-select:none;-webkit-user-select:none}
.fillL .r{fill:#fff;stroke:none;cursor:crosshair}
.strokeL{pointer-events:none}
.lineL{pointer-events:none}
.ol,.ln{fill:none;stroke:var(--ink-line);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.pick .ol,.pick .ln{stroke-width:4}
.seg button[data-tool]{font-size:1.05rem}
.tools{display:flex;flex-direction:column;gap:14px}
.now{display:flex;align-items:center;gap:10px;font-weight:800}
.now i{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);display:inline-block}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:820px){.palette{grid-template-columns:repeat(8,1fr)}}
.sw{aspect-ratio:1/1;border-radius:50%;border:3px solid rgba(0,0,0,.18);padding:0}
.sw[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1;min-width:110px;font-size:1rem;padding:10px 12px}
.tip{margin:0;color:var(--muted);font-weight:700;font-size:.9rem}
</style>
</head>

<div class="page wide">
  <div class="top"><div><h1>Colouring Book</h1><p class="sub">Pick a picture and a colour, then colour it in with the crayon. Your colouring is saved on this device.</p></div></div>
  <div class="picker" id="picker" role="group" aria-label="Pictures"></div>
  <div class="studio">
    <div class="paper"><svg id="art" viewBox="0 0 300 300" role="img" aria-label="Colouring picture"></svg></div>
    <div class="tools card">
      <div class="seg" role="group" aria-label="Tool">
        <button data-tool="crayon" aria-pressed="true">Crayon<small>drag to colour</small></button>
        <button data-tool="fill" aria-pressed="false">Fill<small>tap to fill</small></button>
      </div>
      <div class="seg" role="group" aria-label="Crayon size" id="sizes">
        <button data-size="thin" aria-pressed="false">Thin</button>
        <button data-size="medium" aria-pressed="true">Medium</button>
        <button data-size="thick" aria-pressed="false">Thick</button>
      </div>
      <div class="now"><i id="nowSw"></i><span id="nowName">Red</span></div>
      <div class="palette" id="palette" role="group" aria-label="Colours"></div>
      <div class="row">
        <button class="btn ghost" id="undo">↶ Undo</button>
        <button class="btn ghost" id="eraser">Eraser</button>
      </div>
      <div class="row">
        <button class="btn ghost" id="clear">Start again</button>
        <button class="btn" id="save">Save picture</button>
      </div>
      <p class="tip" id="tip">Drag back and forth to colour. The colour stays inside the part you start in.</p>
    </div>
  </div>
</div>

const COLORS=[
 ['Red','#e03131'],['Orange','#ff922b'],['Yellow','#ffd43b'],['Lime','#94d82d'],['Green','#2f9e44'],['Teal','#12b886'],
 ['Sky blue','#74c0fc'],['Blue','#1c7ed6'],['Navy','#1b2a5e'],['Purple','#7048e8'],['Lilac','#b197fc'],['Pink','#f783ac'],
 ['Hot pink','#d6336c'],['Peach','#ffc9a9'],['Skin','#f1c27d'],['Tan','#c68642'],['Brown','#8d5524'],['Dark brown','#4a2c17'],
 ['Light grey','#dee2e6'],['Grey','#868e96'],['Black','#212529'],['White','#ffffff'],['Gold','#e8b10c'],['Mint','#b2f2bb']
];
const NS='http://www.w3.org/2000/svg';
const SIZES={thin:6,medium:14,thick:26};
let cur=0, color=COLORS[0][1], tool='crayon', size=SIZES.medium, data=null, undo=[], drawing=null;
const key=id=>'col2-'+id;
const art=$('art');
function blank(n){ return {fills:Array(n).fill(null), strokes:[]}; }
function loadData(i){
  const s=SKETCHES[i], n=(s.svg.match(/class="r"/g)||[]).length;
  let d=store.get(key(s.id),null);
  if(!d||!Array.isArray(d.fills)){ d=blank(n); const old=store.get('col-'+s.id,null); if(Array.isArray(old)) old.forEach((c,k)=>{ if(k<n) d.fills[k]=c; }); }
  if(!Array.isArray(d.strokes)) d.strokes=[];
  return d;
}
/* Three layers: fillable areas, crayon strokes (each kept inside its own area by a mask), outlines on top */
function build(svg,i,d,pre){
  const s=SKETCHES[i];
  svg.innerHTML=`<defs></defs><g class="fillL">${s.svg}</g><g class="strokeL"></g><g class="lineL">${s.svg}</g>`;
  svg.querySelectorAll('.fillL .ln').forEach(e=>e.remove());
  svg.querySelectorAll('.lineL .r').forEach(el=>el.setAttribute('class','ol'));
  [...svg.querySelectorAll('.fillL .r')].forEach((el,k)=>{ el.dataset.k=k; if(d.fills[k]) el.style.fill=d.fills[k]; });
  d.strokes.forEach(st=>drawStroke(svg,st,pre));
}
function maskFor(svg,k,pre){
  const id=pre+'m'+k; if(svg.querySelector('#'+id)) return id;
  const shapes=[...svg.querySelectorAll('.fillL .r')]; let inner='';
  shapes.forEach((el,j)=>{ if(j<k) return; const c=el.cloneNode(false); c.removeAttribute('class'); c.removeAttribute('style'); c.removeAttribute('data-k');
    c.setAttribute('fill',j===k?'#fff':'#000'); inner+=c.outerHTML; });
  const m=document.createElementNS(NS,'mask'); m.id=id; m.setAttribute('maskUnits','userSpaceOnUse');
  ['x','y'].forEach(a=>m.setAttribute(a,'-10')); ['width','height'].forEach(a=>m.setAttribute(a,'320'));
  m.innerHTML=inner; svg.querySelector('defs').appendChild(m); return id;
}
function pathD(p){ if(p.length<=2) return `M${p[0]} ${p[1]}l0.01 0`; let d=`M${p[0]} ${p[1]}`; for(let j=2;j<p.length;j+=2) d+=`L${p[j]} ${p[j+1]}`; return d; }
function drawStroke(svg,st,pre){
  const el=document.createElementNS(NS,'path');
  el.setAttribute('d',pathD(st.p)); el.setAttribute('stroke',st.c); el.setAttribute('stroke-width',st.w);
  el.setAttribute('fill','none'); el.setAttribute('stroke-linecap','round'); el.setAttribute('stroke-linejoin','round');
  el.setAttribute('mask',`url(#${maskFor(svg,st.k,pre)})`); svg.querySelector('.strokeL').appendChild(el); return el;
}
function persist(){ store.set(key(SKETCHES[cur].id),data); }
function load(i){
  cur=i; data=loadData(i); undo=[]; build(art,i,data,'a');
  art.setAttribute('aria-label',SKETCHES[i].name+' to colour'); store.set('col-last',SKETCHES[i].id); renderPicker();
}
function toSvg(e){ const p=art.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(art.getScreenCTM().inverse()); return [Math.round(q.x*10)/10, Math.round(q.y*10)/10]; }
art.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.fillL .r'); if(!el) return; e.preventDefault();
  const k=+el.dataset.k;
  if(tool==='fill'){
    const before=data.fills[k]||null, removed=data.strokes.filter(s=>s.k===k);
    if(before===color && !removed.length) return;
    undo.push({t:'fill',k,before,removed}); data.fills[k]=color; data.strokes=data.strokes.filter(s=>s.k!==k);
    build(art,cur,data,'a'); persist(); sound.tap(); updateThumb(); return;
  }
  const [x,y]=toSvg(e); const st={k,c:color,w:size,p:[x,y]};
  drawing={st,el:drawStroke(art,st,'a'),lx:x,ly:y}; try{ art.setPointerCapture(e.pointerId); }catch(_){}
});
art.addEventListener('pointermove',e=>{
  if(!drawing) return; e.preventDefault();
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of (evs.length?evs:[e])){ const [x,y]=toSvg(ev); if(Math.hypot(x-drawing.lx,y-drawing.ly)<1.5) continue; drawing.st.p.push(x,y); drawing.lx=x; drawing.ly=y; }
  drawing.el.setAttribute('d',pathD(drawing.st.p));
});
function endStroke(){ if(!drawing) return; data.strokes.push(drawing.st); undo.push({t:'stroke'}); drawing=null; persist(); updateThumb(); }
art.addEventListener('pointerup',endStroke); art.addEventListener('pointercancel',endStroke); art.addEventListener('lostpointercapture',endStroke);

function pickColor(i){ color=COLORS[i][1]; $('nowSw').style.background=color; $('nowName').textContent=COLORS[i][0];
  document.querySelectorAll('.sw').forEach((b,j)=>b.setAttribute('aria-pressed',String(j===i))); $('eraser').setAttribute('aria-pressed','false'); }
COLORS.forEach(([n,c],i)=>{ const b=document.createElement('button'); b.className='sw'; b.style.background=c; b.setAttribute('aria-label',n); b.title=n; b.onclick=()=>{ sound.tap(); pickColor(i); }; $('palette').appendChild(b); });
$('eraser').onclick=()=>{ color='#ffffff'; $('nowSw').style.background='#fff'; $('nowName').textContent='Eraser (white)'; document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed','false')); $('eraser').setAttribute('aria-pressed','true'); };
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{ tool=b.dataset.tool; document.querySelectorAll('[data-tool]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); $('sizes').hidden=tool!=='crayon';
  $('tip').textContent= tool==='crayon' ? 'Drag back and forth to colour. The colour stays inside the part you start in.' : 'Tap any part to fill it with one colour.'; });
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{ size=SIZES[b.dataset.size]; document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); });
$('undo').onclick=()=>{
  const u=undo.pop(); if(!u) return;
  if(u.t==='stroke'){ data.strokes.pop(); const last=art.querySelector('.strokeL').lastElementChild; if(last) last.remove(); }
  else { data.fills[u.k]=u.before; data.strokes=data.strokes.concat(u.removed); build(art,cur,data,'a'); }
  persist(); updateThumb();
};
let clearArmed=false;
$('clear').onclick=()=>{
  if(!clearArmed){ clearArmed=true; $('clear').textContent='Tap again to clear'; setTimeout(()=>{ clearArmed=false; $('clear').textContent='Start again'; },2500); return; }
  clearArmed=false; $('clear').textContent='Start again';
  data=blank(data.fills.length); persist(); undo=[]; build(art,cur,data,'a'); updateThumb(); $('tip').textContent='Fresh page! Pick a colour and start.';
};
$('save').onclick=()=>{
  const svg=art.cloneNode(true); svg.setAttribute('xmlns',NS); svg.setAttribute('width',900); svg.setAttribute('height',900);
  svg.querySelectorAll('.fillL .r').forEach(el=>{ el.setAttribute('fill',el.style.fill||'#ffffff'); el.setAttribute('stroke','none'); });
  svg.querySelectorAll('.ol,.ln').forEach(el=>{ el.setAttribute('fill','none'); el.setAttribute('stroke','#2b2b2b'); el.setAttribute('stroke-width','3'); el.setAttribute('stroke-linejoin','round'); el.setAttribute('stroke-linecap','round'); });
  const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(svg));
  const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=900; c.height=900; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,900,900); x.drawImage(img,0,0,900,900);
    c.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`my-${SKETCHES[cur].id}.png`; document.body.appendChild(a); a.click(); a.remove(); $('tip').textContent='Saved! Look in your Downloads or Photos.'; },'image/png'); };
  img.src=url;
};
function thumb(i){ const svg=document.createElementNS(NS,'svg'); svg.setAttribute('viewBox','0 0 300 300'); svg.setAttribute('aria-hidden','true'); build(svg,i,i===cur?data:loadData(i),'t'+i+'_'); return svg; }
function renderPicker(){
  $('picker').innerHTML='';
  SKETCHES.forEach((s,i)=>{ const b=document.createElement('button'); b.className='pick'; b.id='pick'+i; b.setAttribute('aria-pressed',String(i===cur));
    b.appendChild(thumb(i)); const n=document.createElement('span'); n.textContent=s.name; b.appendChild(n); b.onclick=()=>{ sound.tap(); load(i); }; $('picker').appendChild(b); });
  const sel=$('pick'+cur); if(sel) sel.scrollIntoView({block:'nearest',inline:'nearest'});
}
function updateThumb(){ const b=$('pick'+cur); if(b) b.replaceChild(thumb(cur), b.querySelector('svg')); }
pickColor(0);
const last=store.get('col-last',null); const li=SKETCHES.findIndex(s=>s.id===last);
load(li>=0?li:0);
})();
